<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#94acd1">
    <title>Offline - Avenire</title>
    <style>
    :root {
      --bg: #f7f5f1;
      --panel: #ffffff;
      --text: #222a39;
      --muted: #667085;
      --accent: #94acd1;
      --border: #e7e7ea;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 1rem;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 0%, #eef2fb 0%, var(--bg) 50%);
    }

    .card {
      width: min(560px, 100%);
      padding: 2rem;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(36, 42, 57, 0.08);
    }

    .logo {
      display: block;
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
    }

    p {
      max-width: 44ch;
      margin: 0.75rem auto 0;
      line-height: 1.55;
      color: var(--muted);
    }

    button {
      padding: 0.7rem 1rem;
      margin-top: 1.5rem;
      font-weight: 600;
      color: #0f172a;
      cursor: pointer;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
    }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="logo"
        src="/branding/avenire-logo-full.svg"
        alt="Avenire logo"
      >
      <h1>You are offline</h1>
      <p>
        Your connection dropped. Reconnect and try again to continue where you
        left off.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
