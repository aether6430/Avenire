[build]
buildCommand = "pnpm --filter @avenire/ai prebuild && if [ \"$APP_ROLE\" = \"web\" ]; then pnpm --filter @avenire/web build; elif [ \"$APP_ROLE\" = \"durable\" ]; then pnpm --filter @avenire/web check-types; else pnpm --filter @avenire/backend build; fi"

[deploy]
preDeployCommand = "if [ \"$APP_ROLE\" = \"web\" ]; then pnpm db:migrate; fi"
startCommand = "if [ \"$APP_ROLE\" = \"web\" ]; then pnpm --filter @avenire/web start; elif [ \"$APP_ROLE\" = \"durable\" ]; then pnpm --filter @avenire/web start:durable-streams; else pnpm --filter @avenire/backend start:ingestion; fi"
