name: Deploy Railway

on:
  workflow_dispatch:
    inputs:
      deploy_durable_streams:
        description: Deploy the Durable Streams service too
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.23.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore production env file
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          test -n "$ENV_PRODUCTION"
          printf '%s\n' "$ENV_PRODUCTION" > .env.production
          chmod 600 .env.production

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_DURABLE_STREAMS: ${{ inputs.deploy_durable_streams && '1' || '0' }}
        run: .github/railway/deploy-production.sh
